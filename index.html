<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b25"><title>Zirvə — Şifrəni yenilə</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f2;color:#122b25;font:15px system-ui,sans-serif;padding:20px}.card{width:min(440px,100%);background:white;border:1px solid #e7ece7;border-radius:22px;padding:28px;box-shadow:0 20px 60px #102b2512}.brand{font-size:13px;font-weight:800;color:#167d59;letter-spacing:1px}.title{font-size:24px;margin:14px 0 5px}.hint{color:#7a8983;font-size:13px;line-height:1.5}label{display:block;font-size:12px;font-weight:700;margin:18px 0 6px}input{width:100%;padding:13px;border:1px solid #e0e8e1;border-radius:11px;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:11px;background:#d5fb85;color:#17352b;font-weight:800;font-size:14px;cursor:pointer}.message{font-size:13px;color:#167d59;min-height:20px;margin-top:12px}.error{color:#b3453e}
</style></head>
<body><main class="card"><div class="brand">✳ ZİRVƏ</div><h1 class="title">Yeni şifrə yarat</h1><p class="hint">Hesabını qorumaq üçün ən azı 8 simvolluq yeni şifrə seç.</p><form id="form"><label for="password">Yeni şifrə</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Şifrəni təkrar yaz</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Şifrəni yenilə</button></form><div id="message" class="message"></div></main>
<script>
// Configure these two public client values before deploying this page.
const PROJECT_URL = "https://YOUR_PROJECT_REF.supabase.co";
const PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
const hash = new URLSearchParams(location.hash.slice(1));
const accessToken = hash.get("access_token");
const message = document.getElementById("message");
if (accessToken && hash.get("type") === "signup") {
  message.textContent = "E-poçt ünvanın təsdiqləndi. Zirvə tətbiqinə qayıdıb daxil ola bilərsən.";
  document.getElementById("form").hidden = true;
} else if (!accessToken || hash.get("type") !== "recovery") {
  message.textContent = "Bərpa linki etibarsızdır və ya vaxtı bitib. Tətbiqdən yeni link istə.";
  message.classList.add("error");
  document.getElementById("form").hidden = true;
}
document.getElementById("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const password = document.getElementById("password").value;
  if (password !== document.getElementById("confirm").value) {
    message.textContent = "Şifrələr uyğun gəlmir.";
    message.classList.add("error");
    return;
  }
  if (password.length < 8 || PROJECT_URL.includes("YOUR_PROJECT_REF") || PUBLISHABLE_KEY.includes("YOUR_SUPABASE_")) {
    message.textContent = "Şifrə ən azı 8 simvol olmalı və səhifə Supabase məlumatları ilə qurulmalıdır.";
    message.classList.add("error");
    return;
  }
  const response = await fetch(PROJECT_URL + "/auth/v1/user", {
    method: "PUT",
    headers: { "Content-Type":"application/json", "apikey":PUBLISHABLE_KEY, "Authorization":"Bearer " + accessToken },
    body: JSON.stringify({ password })
  });
  if (response.ok) {
    message.textContent = "Şifrən yeniləndi. İndi Zirvə tətbiqinə qayıdıb daxil ola bilərsən.";
    document.getElementById("form").hidden = true;
  } else {
    message.textContent = "Linkin vaxtı bitib. Tətbiqdən yeni bərpa linki istə.";
    message.classList.add("error");
  }
});
</script></body></html>

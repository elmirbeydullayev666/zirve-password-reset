<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zirvə — Şifrəni yenilə</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f6f8f4; color: #122b25; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .box { background: #fff; border: 1px solid #e7ece7; border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; }
    h2 { margin-top: 0; color: #122b25; }
    input { width: 100%; box-sizing: border-box; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #d5dcd5; font-size: 14px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 12px; background: #d5fb85; color: #122b25; font-weight: bold; font-size: 14px; cursor: pointer; }
    #msg { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Yeni şifrə təyin et</h2>
    <p style="font-size:13px; color:#7a8983;">Zirvə hesabı üçün yeni şifrəni daxil et.</p>
    <input id="pass1" type="password" placeholder="Yeni şifrə (ən azı 8 simvol)" />
    <input id="pass2" type="password" placeholder="Yeni şifrəni təkrar yaz" />
    <button onclick="updatePassword()">Şifrəni yenilə</button>
    <div id="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://rpynobmekvscagjyvphz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_y7bGCadzVAJSYxM5VQZPoA_c_xz9-gZ";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function updatePassword() {
      const p1 = document.getElementById("pass1").value;
      const p2 = document.getElementById("pass2").value;
      const msg = document.getElementById("msg");

      if (p1.length < 8) {
        msg.style.color = "#b3453e";
        msg.textContent = "Şifrə ən azı 8 simvoldan ibarət olmalıdır.";
        return;
      }
      if (p1 !== p2) {
        msg.style.color = "#b3453e";
        msg.textContent = "Şifrələr uyğun gəlmir.";
        return;
      }

      const { error } = await client.auth.updateUser({ password: p1 });
      if (error) {
        msg.style.color = "#b3453e";
        msg.textContent = "Xəta: " + error.message;
      } else {
        msg.style.color = "#167d59";
        msg.textContent = "Şifrə uğurla yeniləndi! İndi tətbiqə qayıdıb daxil ola bilərsən.";
      }
    }
  </script>
</body>
</html>
